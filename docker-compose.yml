# Jairbet bot on the home server.
#   docker compose up -d --build   # start / update
#   docker compose logs -f         # live logs
services:
  bot:
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    image: jairbet-bot
    container_name: jairbet-bot
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      # Fixed paths inside the container; they override any value in .env.
      DB_PATH: /data/jairbet.db
      BACKUP_DIR: /data/backups
      TZ: America/Sao_Paulo
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
